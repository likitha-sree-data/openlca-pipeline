services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ../../..:/workspaces:cached
    command: sleep infinity
    depends_on: [db]
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drape
    volumes:
      - drape-db:/var/lib/postgresql/data
volumes:
  drape-db:
