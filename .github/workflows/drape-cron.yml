name: Drape reminders

# Runs hourly so 48-hour reminders go out even if the Space was asleep.
# Set repository secrets DRAPE_URL (for example https://you-drape.hf.space)
# and DRAPE_CRON_SECRET (same value as INTERNAL_CRON_SECRET on the Space).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call run-due (retries while the Space wakes up)
        env:
          DRAPE_URL: ${{ secrets.DRAPE_URL }}
          DRAPE_CRON_SECRET: ${{ secrets.DRAPE_CRON_SECRET }}
        run: |
          if [ -z "$DRAPE_URL" ] || [ -z "$DRAPE_CRON_SECRET" ]; then
            echo "DRAPE_URL or DRAPE_CRON_SECRET is not set. Skipping."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "$DRAPE_URL/internal/run-due" \
              -H "X-Cron-Secret: $DRAPE_CRON_SECRET" --max-time 60 || echo 000)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then cat out.json; exit 0; fi
            sleep 30
          done
          exit 1
