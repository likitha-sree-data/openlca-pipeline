name: Drape CI

on:
  push:
    paths: ["drape/**", ".github/workflows/drape-ci.yml"]
  pull_request:
    paths: ["drape/**", ".github/workflows/drape-ci.yml"]

defaults:
  run:
    working-directory: drape

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/drape_test
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/drape_e2e
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: drape/backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: drape/frontend/package-lock.json
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database drape_test"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database drape_e2e"
      - name: Install backend
        run: pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: drape/backend
        run: TEST_ENABLE_REMBG=true python -m pytest -q
      - name: Install frontend
        working-directory: drape/frontend
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: drape/frontend
        run: npm run typecheck && npm test
      - name: Production build
        working-directory: drape/frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: drape/frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the production build
        working-directory: drape/frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: drape/frontend/test-results
